# Планировщик с PostgreSQL в отдельном контейнере.
# Пароли и имена берутся из файла .env (см. .env.example).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    ports:
      # Доступ к базе с хоста (psql, go run против PostgreSQL). Только localhost.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Данные PostgreSQL хранятся в именованном томе на диске хоста
      # и переживают пересоздание контейнеров.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todo}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${TODO_PORT:-7540}:7540"
    environment:
      TODO_PORT: 7540
      TODO_PASSWORD: ${TODO_PASSWORD:-}
      # DSN собирается из тех же переменных, что и у контейнера db.
      TODO_POSTGRES_DSN: postgres://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-todo}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
